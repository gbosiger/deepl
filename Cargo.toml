[workspace]
members = ["mit/lecture2"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.92"
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Each crate inherits the version and enables the features it needs.
burn = { version = "=0.21.0", default-features = false, features = ["std"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
csv = "1"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
